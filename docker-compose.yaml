services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant-vector-db
    ports:
      # 6333: REST API (HTTP)
      - "6333:6333"
      # 6334: gRPC API
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: vectra-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_storage:/data
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: vectra-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: vectra
      POSTGRES_USER: vectra
      POSTGRES_PASSWORD: vectra_password
    volumes:
      - postgres_storage:/var/lib/postgresql
    restart: unless-stopped
volumes:
  qdrant_storage:
  redis_storage:
  postgres_storage:
